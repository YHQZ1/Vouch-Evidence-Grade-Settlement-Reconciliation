name: vouch

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      VOUCH_SERVICE_NAME: vouch-backend
      VOUCH_API_VERSION: v1
      VOUCH_ENVIRONMENT: ${VOUCH_ENVIRONMENT:-development}
      VOUCH_LOG_LEVEL: ${VOUCH_LOG_LEVEL:-INFO}
      VOUCH_MAX_UPLOAD_BYTES: ${VOUCH_MAX_UPLOAD_BYTES:-10485760}
      VOUCH_MAX_PAGE_SIZE: ${VOUCH_MAX_PAGE_SIZE:-100}
      VOUCH_AI_ENABLED: ${VOUCH_AI_ENABLED:-true}
      VOUCH_AI_PROVIDER: ${VOUCH_AI_PROVIDER:-ollama}
      VOUCH_AI_MODEL: ${VOUCH_AI_MODEL:-llama3.2:3b}
      VOUCH_AI_ENDPOINT: ${VOUCH_AI_ENDPOINT:-http://host.docker.internal:11434}
      VOUCH_AI_ALLOW_DOCKER_HOST_GATEWAY: ${VOUCH_AI_ALLOW_DOCKER_HOST_GATEWAY:-true}
      VOUCH_AI_CONNECT_TIMEOUT_MS: ${VOUCH_AI_CONNECT_TIMEOUT_MS:-2000}
      VOUCH_AI_READ_TIMEOUT_MS: ${VOUCH_AI_READ_TIMEOUT_MS:-60000}
      VOUCH_AI_MAX_TOTAL_TIME_MS: ${VOUCH_AI_MAX_TOTAL_TIME_MS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    ports:
      - "${VOUCH_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; r = urlopen('http://127.0.0.1:8000/healthz', timeout=2); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${VOUCH_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped
